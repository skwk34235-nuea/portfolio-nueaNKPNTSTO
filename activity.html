<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Activities</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://lh3.googleusercontent.com/d/1ZaqaGtuNJVTbq2ZpS2f5zkkSXdVCLNJ-" rel="icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Noto Sans Thai', 'sans-serif'] },
                    colors: {
                        'p-dark': '#78A3D4', 'p-med': '#8BADD3', 'p-light': '#CFE0EB',
                        'fb': '#1877F2', 'ig': '#E4405F', 'line': '#06C755'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-700 flex flex-col min-h-screen">

    <!-- Navigation -->
    <nav class="bg-white/90 backdrop-blur sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 flex justify-between items-center py-4">
            <div class="text-2xl font-bold text-p-dark cursor-pointer hover:opacity-80 transition" onclick="window.location.href='index.html'">
                <i class="fas fa-folder-open mr-2"></i>Portfolio
            </div>
            <div class="hidden md:flex space-x-6 font-medium">
                <a href="index.html" class="hover:text-p-dark">หน้าหลัก</a>
                <a href="education.html" class="hover:text-p-dark">ประวัติการศึกษา</a>
                <a href="activity.html" class="hover:text-p-dark text-p-dark">กิจกรรม</a>
                <a href="admin.html" class="text-gray-400 hover:text-p-dark" title="Admin Login"><i class="fas fa-cog"></i></a>
            </div>
            <div class="md:hidden flex items-center space-x-4">
                <button onclick="window.location.href='index.html'" class="text-p-dark hover:bg-gray-100 p-2 rounded-full transition"><i class="fas fa-home text-xl"></i></button>
                <button onclick="window.location.href='admin.html'" class="text-gray-500 hover:bg-gray-100 p-2 rounded-full transition"><i class="fas fa-user-cog text-xl"></i></button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="app-root" class="flex-grow relative active">
        <section id="view-activity" class="view-section active">
            <div class="max-w-6xl mx-auto px-4 py-8">
                <button onclick="window.location.href='index.html'" class="mb-6 flex items-center text-sm text-gray-500 hover:text-p-dark transition"><i class="fas fa-arrow-left mr-2"></i> กลับหน้าหลัก</button>
                <h1 class="text-3xl font-bold text-center mb-6 text-p-dark">กิจกรรมและผลงานทั้งหมด</h1>
                
                <!-- Filter Buttons (Dynamic) -->
                <div class="flex flex-wrap justify-center gap-2 mb-8" id="activity-filters">
                    <button class="filter-btn active">ทั้งหมด</button>
                </div>

                <div id="full-activity-list" class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start"></div>
                <div id="no-activity-msg" class="text-center text-gray-500 py-10 hidden">ไม่พบกิจกรรมในหมวดหมู่นี้</div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-gray-400 py-8 text-center mt-10">
        <p>&copy; 2025 Portfolio Project.</p>
        <div class="flex justify-center gap-4 mt-4 text-sm">
            <span class="cursor-pointer hover:text-white" onclick="window.location.href='index.html'">Home</span>
            <span class="cursor-pointer hover:text-white" onclick="window.location.href='admin.html'">Admin Panel</span>
        </div>
    </footer>

    <!-- ACTIVITY MODAL -->
    <div id="activity-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm p-4" onclick="app.closeModal(event)">
        <div class="bg-white rounded-xl max-w-4xl w-full max-h-[90vh] overflow-y-auto relative shadow-2xl animate-zoomIn" onclick="event.stopPropagation()">
            <button onclick="app.closeModal()" class="absolute top-4 right-4 bg-gray-200 hover:bg-gray-300 rounded-full p-2 text-gray-600 transition z-10 shadow-md">
                <i class="fas fa-times text-xl w-6 h-6 flex items-center justify-center"></i>
            </button>
            <div class="grid grid-cols-1 md:grid-cols-2">
                <div class="bg-gray-100 flex items-center justify-center p-4 min-h-[300px]">
                    <img id="modal-img" src="" class="w-full h-auto object-contain max-h-[70vh] rounded shadow-sm">
                </div>
                <div class="p-8 flex flex-col">
                    <span id="modal-cat" class="text-sm font-bold text-p-dark uppercase tracking-wider mb-3 bg-blue-50 inline-block w-fit px-2 py-1 rounded"></span>
                    <h2 id="modal-title" class="text-3xl font-bold text-gray-800 mb-4 leading-tight"></h2>
                    <p id="modal-desc" class="text-gray-600 text-lg leading-relaxed whitespace-pre-wrap"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- LOADER -->
    <div id="loader" class="fixed inset-0 bg-white/90 z-[100] flex items-center justify-center hidden">
        <div class="text-center">
            <div class="scale-loader-container mb-4">
                <div class="scale-loader-bar"></div>
                <div class="scale-loader-bar"></div>
                <div class="scale-loader-bar"></div>
                <div class="scale-loader-bar"></div>
                <div class="scale-loader-bar"></div>
            </div>
            <p class="text-sm text-gray-500" id="loader-text">Loading...</p>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="app.js"></script>
</body>
</html>
